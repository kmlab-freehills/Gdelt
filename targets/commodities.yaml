# targets/commodities.yaml
# GDELT v5 quadgram ngrams版クエリ定義。
#
# 各クエリは "must" リストを持つ。要素は以下のいずれか:
#   - 文字列: 必須フレーズ（4語以内、小文字）
#   - 文字列のリスト: うち少なくとも1つが必須（ORグループ）
# オプションで "exclude"（1つでも含まれたら不一致）。
# グローバル除外フィルタ（ngrams_fetcher.GLOBAL_EXCLUDE）は全クエリに自動付加されるため
# ここに記載不要。
#
# lang: tocのlangコード（en/ja/zh等）。この言語の記事のみが照合対象になる。
#
# monitor: 幅広いクエリで速報性重視の証拠収集（Migita的）
# analyze: 需要シグナルに特化した絞り込みクエリ（Kizue的）
# どちらか一方のみの定義も可（ブロックを省略する）。

"copper":
  label: "銅 (Copper)"
  lang: "en"
  monitor:
    queries:
      - must: ["copper", ["demand", "shortage", "surplus", "inventory", "stockpile"]]
      - must: ["copper market", ["rally", "squeeze", "disruption", "crunch"]]
      - must: ["red metal", ["market", "demand", "shortage", "price"]]
  analyze:
    queries:
      - must: ["copper demand", ["surge", "shortage", "deficit"]]
      - must: ["copper", ["consumption", "offtake", "procurement"], ["surge", "shortage", "increase"]]
      - must: [["red metal", "copper cathode"], ["demand", "shortage"]]
      - must: ["copper demand", ["ahead of forecast", "exceeds forecast", "beats expectations"]]
      - must: ["copper", ["unexpected", "surprise"], ["demand", "shortage", "bottleneck"]]

"gold":
  label: "金 (Gold)"
  lang: "en"
  monitor:
    queries:
      - must: ["gold", ["demand", "shortage", "surplus", "buying", "selling"]]
      - must: ["central bank", "gold", ["buying", "purchase", "reserve"]]
      - must: ["gold market", ["rally", "selloff", "surge"]]
  analyze:
    queries:
      - must: ["gold demand", ["record", "surge", "shortage", "deficit"]]
      - must: ["central bank", ["gold", "bullion"], ["buying", "purchase", "demand"]]
      - must: [["bullion demand", "gold bullion", "physical gold"], ["surge", "shortage", "record"]]
      - must: ["gold demand", ["ahead of forecast", "beats expectations", "unexpected", "supply crunch"]]
      - must: ["gold imports", ["surge", "ban", "restriction", "record"]]

"uranium":
  label: "ウラン (Uranium)"
  lang: "en"
  monitor:
    queries:
      - must: ["uranium", ["demand", "shortage", "supply", "reactor", "nuclear"]]
      - must: ["nuclear power", ["fuel", "reactor", "shortage", "demand"]]
  analyze:
    queries:
      - must: ["uranium demand", ["nuclear", "surge", "shortage"]]
      - must: ["uranium", ["consumption", "procurement"], ["reactor", "shortage", "surge"]]
      - must: [["yellowcake", "u3o8"], ["demand", "shortage"]]
      - must: ["uranium demand", ["ahead of forecast", "beats expectations", "unexpected"]]
      - must: ["uranium", ["shortage", "supply crunch"], "reactor"]

"rare earth":
  label: "レアアース (Rare Earth)"
  lang: "en"
  monitor:
    queries:
      - must: ["rare earth", ["demand", "shortage", "supply", "restriction"]]
      - must: [["critical minerals", "strategic minerals"], ["shortage", "demand", "supply"]]
  analyze:
    queries:
      - must: ["rare earth", ["demand", "shortage"], ["surge", "critical"]]
      - must: [["critical minerals", "strategic minerals"], ["shortage", "demand"]]
      - must: [["neodymium", "dysprosium"], ["shortage", "demand"]]
      - must: ["rare earth", "export restriction"]
      - must: ["rare earth", "shortage", ["ahead of", "unexpected", "bottleneck"]]
      - must: [["critical minerals bottleneck", "rare earth supply crunch"]]

"natural gas":
  label: "天然ガス・LNG (Natural Gas / LNG)"
  lang: "en"
  monitor:
    queries:
      - must: [["natural gas", "lng"], ["demand", "shortage", "surplus", "storage"]]
      - must: ["lng", ["market", "cargo", "spot", "import", "export"]]
      - must: ["gas", ["shortage", "supply", "disruption", "demand"]]
  analyze:
    queries:
      - must: [["natural gas", "lng"], "demand", ["surge", "record", "shortage"]]
      - must: [["gas consumption", "lng imports"], ["record", "surge"]]
      - must: [["pipeline gas", "lng"], ["shortage", "spot demand"], "surge"]
      - must: [["natural gas", "lng"], "demand", ["ahead of forecast", "beats expectations", "unexpected"]]
      - must: [["natural gas", "lng"], ["supply crunch", "lng bottleneck demand"]]

"silver":
  label: "銀 (Silver)"
  lang: "en"
  monitor:
    queries:
      - must: ["silver", ["demand", "shortage", "supply", "industrial"]]
      - must: ["silver market", ["rally", "deficit", "squeeze"]]
  analyze:
    queries:
      - must: ["silver demand", ["surge", "shortage", "deficit"]]
      - must: ["silver", ["consumption", "offtake"], ["solar", "increase", "surge"]]
      - must: [["silver bullion", "industrial silver"], ["shortage", "demand"]]
      - must: ["silver demand", ["ahead of forecast", "beats expectations", "unexpected"]]
      - must: ["silver", ["shortage", "supply deficit"], ["solar", "supply crunch"]]

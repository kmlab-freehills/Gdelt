# targets/infrastructure.yaml
# 都市インフラ課題の検証用ターゲット（テスト目的で追加）。
#
# GDELT v5 quadgram ngrams版クエリ定義。
#
# 各クエリは "must" リストを持つ。要素は以下のいずれか:
#   - 文字列: 必須フレーズ（4語以内、小文字）
#   - 文字列のリスト: うち少なくとも1つが必須（ORグループ）
# オプションで "exclude"（1つでも含まれたら不一致）。
# グローバル除外フィルタ（ngrams_fetcher.GLOBAL_EXCLUDE）は全クエリに自動付加される。
#
# lang: tocのlangコード。この言語の記事のみが照合対象になる。
#
# 【言語方針】当初は lang: "ja"（日本語ネイティブキーワード）で運用したが、
# 12時間の実測でGDELT ngramsの日本語記事は約77件/時と母数が少なく、
# analyze一致0件だったため、いったん英語ヒット狙いに切り替えた（2026-07-13）。
# 日本語版クエリはgit履歴を参照。
#
# monitor: 幅広いクエリで速報性重視の証拠収集
# analyze: 老朽化・予算不足などの因果関係に絞り込んだクエリ

"aging_water_infrastructure":
  label: "水道管老朽化 (Aging Water Infrastructure)"
  lang: "en"
  monitor:
    queries:
      - must: ["water main", ["break", "breaks", "broke", "burst", "rupture"]]
      - must: ["water infrastructure", ["crisis", "failure", "outdated", "aging"]]
  analyze:
    queries:
      - must: [["aging water infrastructure", "aging pipes", "aging water pipes"]]
      - must: ["water main", ["aging", "deteriorating", "outdated", "corroding"]]
      - must: ["water utility", ["underfunded", "budget shortfall", "funding gap", "underinvestment"]]
      - must: ["lead pipes", ["replacement", "funding", "delay", "backlog"]]
      - must: ["water infrastructure", ["investment", "funding", "budget"]]

"seismic_building_risk":
  label: "非耐震建築物 (Seismic Building Risk)"
  lang: "en"
  monitor:
    queries:
      - must: ["seismic retrofit", ["delay", "backlog", "funding"]]
      - must: ["unreinforced masonry", ["building", "buildings", "risk", "retrofit"]]
  analyze:
    queries:
      - must: ["seismic retrofit", ["funding", "budget", "delay", "backlog", "shortfall"]]
      - must: ["unreinforced masonry", ["building", "buildings", "retrofit", "vulnerable"]]
      - must: [["seismic", "earthquake"], "building", ["retrofit", "compliance", "upgrade"]]
      - must: ["earthquake risk", "building", ["funding", "budget", "retrofit"]]
      - must: ["seismic", ["retrofit", "safety"], ["funding", "budget", "shortfall"]]

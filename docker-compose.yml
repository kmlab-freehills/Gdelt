version: '3.8'

services:
  db:
    image: postgres:15
    container_name: gdelt_postgres
    restart: no
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  fetcher:
    build: .
    container_name: gdelt_fetcher
    restart: no
    env_file: .env
    # コモディティ（需要シグナル）専用。建設・インフラは専用サービスで収集するため絞り込む。
    # 広いクエリ(monitor)は量が多く質が低いため、狭いクエリ(analyze)のみ使う（2026-10-06の標本評価による）。
    # 銀はクエリが機能していないため除外。初回はGDELTのファイル保持期間の上限付近（42日分）をさかのぼる。
    environment:
      TARGET_FILTER: "copper,gold,uranium,rare earth,natural gas"
      QUERY_MODES: "analyze"
      FETCH_INTERVAL_MINUTES: "15"
      NGRAMS_BACKFILL_MINUTES: "60480"
    command: python fetcher.py
    depends_on:
      db:
        condition: service_healthy

  llm_processor:
    build: .
    container_name: gdelt_llm_processor
    restart: no
    env_file: .env
    environment:
      LLM_TARGET_FILTER: "copper,gold,uranium,rare earth,natural gas"
      # 狭いクエリ(analyze)で集めた記事だけを処理する（9/1〜3に広いクエリで集めた記事は対象外）
      LLM_MODE_FILTER: "analyze"
      # 過去分（約8,000件）を早く処理するため上限を大きくする。15分を超える回は次回が自動で見送られ、二重には動かない
      OLLAMA_BATCH_LIMIT: "1000"
      LLM_INTERVAL_MINUTES: "15"
    command: python llm_processor.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # インフラターゲット（英語+日本語）専用の常時収集パイプライン。
  # TARGET_FILTER/LLM_TARGET_FILTERで絞り込み、fetcher/llm_processorとは
  # 独立したカーソルで動作するため、commodities収集には影響しない。
  fetcher_infra:
    build: .
    container_name: gdelt_fetcher_infra
    restart: no
    env_file: .env
    environment:
      TARGET_FILTER: "aging_water_infrastructure,aging_water_infrastructure_ja,seismic_building_risk,seismic_building_risk_ja"
      FETCH_INTERVAL_MINUTES: "15"
    command: python fetcher.py
    depends_on:
      db:
        condition: service_healthy

  llm_processor_infra:
    build: .
    container_name: gdelt_llm_processor_infra
    restart: no
    env_file: .env
    environment:
      LLM_TARGET_FILTER: "aging_water_infrastructure,aging_water_infrastructure_ja,seismic_building_risk,seismic_building_risk_ja"
      LLM_INTERVAL_MINUTES: "15"
    command: python llm_processor.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # 高層ビル・大規模建設ターゲット（英語+日本語）専用の常時収集パイプライン。
  # fetcher_infra/llm_processor_infraと同様、独立したカーソルで動作するため
  # commodities/infra収集には影響しない。
  fetcher_construction:
    build: .
    container_name: gdelt_fetcher_construction
    restart: no
    env_file: .env
    environment:
      TARGET_FILTER: "large_scale_construction,large_scale_construction_ja"
      FETCH_INTERVAL_MINUTES: "15"
    command: python fetcher.py
    depends_on:
      db:
        condition: service_healthy

  llm_processor_construction:
    build: .
    container_name: gdelt_llm_processor_construction
    restart: no
    env_file: .env
    environment:
      LLM_TARGET_FILTER: "large_scale_construction,large_scale_construction_ja"
      LLM_INTERVAL_MINUTES: "15"
    command: python llm_processor.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    container_name: gdelt_api
    restart: no
    env_file: .env
    ports:
      - "8000:8000"
    command: python api.py
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

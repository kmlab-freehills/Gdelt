# sources.yaml
# 媒体の区分（tier）と配信系列（network）の対応表。ソース信頼度の評価に使う。
#
# - ドメインは登録ドメイン単位（650keni.iheart.com → iheart.com）で書く。
# - tier は「その媒体が一般にどういう性格か」の区分で、記事1本ごとの取材性は
#   LLMによる判定（classify_sources.py の source_assessment）で別に見る。
# - network は、同じ記事を複数のドメインに配信している系列。系列内の複数ドメインで
#   報じられても「独立した裏取り」とはみなさないために使う。
# - ここに無いドメインは unclassified として扱う。
#
# 初版（2026-10-06）: 建設ターゲットの採用記事の上位ドメインを中心に作成。要確認・随時追記。

tiers:
